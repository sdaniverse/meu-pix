<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-purple': '#9b59b6', // O roxo escolhido
                        'brand-purple-dark': '#8e44ad',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-md text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Pagamento Pix</h1>
        <p class="text-gray-500 mb-8">Escaneie o QR Code ou copie o código abaixo para pagar no aplicativo do seu banco.</p>
        
        <div class="mb-8 flex justify-center">
            <div class="border-4 border-brand-purple rounded-2xl p-2 bg-gray-50 shadow-sm">
                <!-- 
                  ATENÇÃO: Substitua o link abaixo (src="...") pelo link ou caminho da imagem do SEU QR Code.
                -->
                <img src="https://placehold.co/250x250/9b59b6/white?text=Seu+QR+Code+Aqui" 
                     alt="QR Code Pix" class="w-64 h-64 object-contain rounded-xl">
            </div>
        </div>

        <div>
            <button onclick="copiarPix()" class="w-full flex items-center justify-center gap-3 bg-brand-purple hover:bg-brand-purple-dark text-white py-4 rounded-xl font-bold text-lg transition shadow-md hover:shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span id="btn-copiar-texto">Copiar Código Pix</span>
            </button>
        </div>
    </div>

    <script>
        function copiarPix() {
            // ATENÇÃO: Coloque o seu código "Pix Copia e Cola" real entre as aspas abaixo
            const pixCode = "COLOQUE_SEU_CODIGO_PIX_COPIA_E_COLA_AQUI";

            // Lógica simples para copiar o texto
            const tempInput = document.createElement("input");
            tempInput.value = pixCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // Feedback visual no botão
            const btnTexto = document.getElementById('btn-copiar-texto');
            btnTexto.innerText = "Código Copiado com Sucesso!";
            
            // Volta o texto original após 3 segundos
            setTimeout(() => {
                btnTexto.innerText = "Copiar Código Pix";
            }, 3000);
        }
    </script>
</body>
</html>
